<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENG_CORE - Modern English Tracker</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="selection:bg-orange-500/20 selection:text-orange-200">
    <!-- Main Content -->
    <div class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
        <main class="w-full max-w-lg space-y-6">

            <!-- Header section -->
            <header class="text-center space-y-2 mb-8">
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 bg-orange-500/10 border border-orange-500/20 rounded-full">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                    </span>
                    <span class="text-[10px] font-bold text-orange-500 uppercase tracking-widest">Active Tracker</span>
                </div>
                <h1 class="text-4xl font-extrabold text-white tracking-tight">ENG_CORE</h1>
                <p class="text-slate-500 text-sm font-medium">Precision English Progress Management</p>
            </header>

            <!-- Dashboard Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="premium-card p-6 rounded-2xl group">
                    <div class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Current Streak</div>
                    <div class="flex items-baseline gap-2">
                        <span id="streak-val" class="text-3xl font-black text-white">0</span>
                        <span class="text-orange-500 font-bold text-xs">Days</span>
                    </div>
                </div>
                <div class="premium-card p-6 rounded-2xl group">
                    <div class="text-slate-500 text-[10px] font-bold uppercase tracking-wider mb-1">Total Units</div>
                    <div class="flex items-baseline gap-2">
                        <span id="total-units-val" class="text-3xl font-black text-white">0</span>
                        <span class="text-slate-500 font-bold text-xs">Units</span>
                    </div>
                </div>
            </div>

            <!-- Activity Heatmap -->
            <section class="premium-card p-6 rounded-2xl">
                <h3
                    class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center justify-between">
                    Activity Heatmap
                    <span class="text-[10px] font-medium text-slate-600">Last 35 Days</span>
                </h3>
                <div id="calendar" class="calendar-grid">
                    <!-- Dots injected by JS -->
                </div>
                <div class="mt-4 flex items-center justify-end gap-2 text-[10px] text-slate-500">
                    <span>Less</span>
                    <div class="flex gap-1">
                        <div class="w-2.5 h-2.5 rounded-[2px] bg-slate-800/40"></div>
                        <div class="w-2.5 h-2.5 rounded-[2px] bg-orange-900/40"></div>
                        <div class="w-2.5 h-2.5 rounded-[2px] bg-orange-700/60"></div>
                        <div class="w-2.5 h-2.5 rounded-[2px] bg-orange-500"></div>
                    </div>
                    <span>More</span>
                </div>
            </section>

            <!-- Quick Action -->
            <section class="premium-card p-6 rounded-2xl">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Daily Check-in</h3>
                <div class="space-y-4">
                    <select id="book-select"
                        class="premium-input w-full p-3 rounded-xl text-sm appearance-none cursor-pointer">
                        <option value="">Select a book...</option>
                    </select>
                    <div class="flex gap-2">
                        <input type="number" id="checkin-unit" placeholder="Unit #"
                            class="premium-input w-24 p-3 rounded-xl text-center text-sm">
                        <button id="checkin-btn" class="premium-button flex-1 rounded-xl p-3 text-sm">
                            Mark as Done
                        </button>
                    </div>
                </div>
            </section>

            <!-- Manage Books -->
            <section class="space-y-4">
                <div class="flex items-center justify-between px-2">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Your Material</h3>
                    <button onclick="document.getElementById('add-book-modal').classList.remove('hidden')"
                        class="text-[10px] font-bold text-orange-500 hover:text-orange-400 uppercase tracking-tighter transition-colors">
                        + New Entry
                    </button>
                </div>
                <div id="book-list" class="grid gap-3">
                    <!-- Cards injected by JS -->
                </div>
            </section>

        </main>
    </div>

    <!-- Add Book Modal -->
    <div id="add-book-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm"
            onclick="document.getElementById('add-book-modal').classList.add('hidden')"></div>
        <div class="premium-card w-full max-w-sm rounded-3xl p-8 relative z-[101]">
            <h2 class="text-xl font-bold text-white mb-6">Add New Material</h2>
            <form id="book-form" class="space-y-4">
                <input type="text" id="book-title" placeholder="Book Title (e.g. English Grammar)"
                    class="premium-input w-full p-4 rounded-2xl text-sm" required>
                <input type="number" id="book-units" placeholder="Total Units Count"
                    class="premium-input w-full p-4 rounded-2xl text-sm" required>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="document.getElementById('add-book-modal').classList.add('hidden')"
                        class="flex-1 p-4 rounded-2xl text-sm font-bold text-slate-400 hover:bg-slate-800 transition-colors">Cancel</button>
                    <button type="submit" class="premium-button flex-1 rounded-2xl p-4 text-sm">Add Material</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/app.js"></script>
</body>

</html>
